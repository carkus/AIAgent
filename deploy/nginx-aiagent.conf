# Pre-Certbot version — run `sudo certbot --nginx -d agent.carkus.com` after
# installing this, same as every other site on this droplet. Certbot rewrites
# this file in place to add the `listen 443 ssl` block, the cert paths, and
# the :80 -> :443 redirect (compare chattyprayers' config for the shape it'll
# take). Pick whatever subdomain you actually want instead of agent.carkus.com.
#
# Frontend and backend are served from the same origin here (static build +
# proxied API paths under one nginx server block) — no CORS, no separate
# hosting step, matching how the rest of this droplet is done.
server {
    listen 80;
    server_name agent.carkus.com;

    root /var/www/aiagent/frontend/dist;
    index index.html;

    # Single shared login gates the whole app — frontend and API alike.
    # Create the password file once: sudo htpasswd -c /etc/nginx/.htpasswd-aiagent <username>
    auth_basic "AIAgent";
    auth_basic_user_file /etc/nginx/.htpasswd-aiagent;

    location /bootstrap {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /models {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /file/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /agent {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # /agent streams NDJSON as it's generated — buffering would hold the
        # whole response until gunicorn's --timeout instead of forwarding
        # events live.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /agents {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Published agents exposed as MCP tools (backend/mcp_server.py) — a
    # separate uvicorn process (deploy/aiagent-mcp.service, its own port,
    # 8788) since the mcp SDK's HTTP transport is ASGI, not WSGI like
    # gunicorn's /bootstrap|/agent|/models|/file above.
    #
    # Deliberately opted OUT of this server block's shared auth_basic —
    # that's one human login for the whole site, not something a
    # programmatic MCP client (e.g. jobfit) should hold. mcp_server.py's own
    # _ApiKeyMiddleware checks a per-consumer MCP_API_KEY (X-Api-Key header
    # or ?key= query param) instead, set in env.json/systemd env alongside
    # the other prod secrets — revocable independently of the shared site
    # login, and unset in local dev so nothing changes there.
    location /mcp {
        auth_basic off;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Streamable HTTP keeps a connection open for server-to-client
        # messages — same "don't buffer a live stream" reasoning as /agent.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
