AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Self-scaffolding AI Agent

Globals:
  Function:
    Timeout: 120
    MemorySize: 512
    Runtime: python3.12
    CodeUri: backend/src/
    Environment:
      Variables:
        GEMINI_API_KEY: !Ref GeminiApiKey

Parameters:
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: >
      Gemini API key. LLM_PROVIDER/OLLAMA_* are deliberately not wired here —
      a deployed Lambda cannot reach a developer's local Ollama, so cloud
      deploys always use Gemini; the local-LLM option is dev-only (see .env.example).

Resources:
  AgentApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  BootstrapFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.bootstrap_handler
      Description: Generates agent config from user-stated purpose
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AgentApi
            Path: /bootstrap
            Method: post

  ModelsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.models_handler
      Description: >
        Lists locally-pulled Ollama models for the Setup screen's picker.
        Always returns [] when deployed (a Lambda can't reach a developer's
        localhost) — only meaningful under `sam local` / backend/server.py.
      Events:
        Get:
          Type: Api
          Properties:
            RestApiId: !Ref AgentApi
            Path: /models
            Method: get

  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.agent_handler
      Description: Streaming agent loop — invoked via Function URL, not API Gateway
      Timeout: 120
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins:
            - "*"
          AllowHeaders:
            - "Content-Type"
          AllowMethods:
            - POST

Outputs:
  BootstrapEndpoint:
    Description: Bootstrap API Gateway endpoint
    Value: !Sub 'https://${AgentApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/bootstrap'
    Export:
      Name: BootstrapEndpoint

  AgentStreamUrl:
    Description: Agent Function URL (streaming)
    Value: !GetAtt AgentFunctionUrl.FunctionUrl
    Export:
      Name: AgentStreamUrl
